<!DOCTYPE html>
<html>
<head>
  <title>LandEye</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Quote at the top -->
    <p class="quote">"Illegal mining harms our land, water, and health. Protect Ghana, protect yourself."</p>

    <h1>LandEye</h1>
    <p>Digital Land Records System</p>

    <!-- Disaster images -->
    <div class="disasters">
      <h2>Effects of Illegal Mining</h2>
      <img src="disaster1.jpg" alt="Flood caused by illegal mining">
      <img src="disaster2.jpg" alt="Destroyed land by illegal mining">
    </div>

    <!-- Add Land Section -->
    <div class="form-section">
      <h2>Add Land</h2>
      <input type="text" id="owner" placeholder="Land Owner (optional)">
      <input type="text" id="location" placeholder="Land Location (optional)">
      
      <select id="region">
        <option value="">Select Region (optional)</option>
        <option value="Greater Accra">Greater Accra</option>
        <option value="Ashanti">Ashanti</option>
        <option value="Eastern">Eastern</option>
        <option value="Western">Western</option>
        <option value="Central">Central</option>
        <option value="Northern">Northern</option>
        <option value="Upper East">Upper East</option>
        <option value="Upper West">Upper West</option>
        <option value="Volta">Volta</option>
        <option value="Bono">Bono</option>
        <option value="Bono East">Bono East</option>
        <option value="Ahafo">Ahafo</option>
        <option value="Oti">Oti</option>
        <option value="North East">North East</option>
        <option value="Savannah">Savannah</option>
        <option value="Western North">Western North</option>
        <option value="Western East">Western East</option>
      </select>

      <input type="text" id="size" placeholder="Land Size (optional)">
      <button onclick="saveLand()">Save Land</button>
    </div>

    <!-- Search Section -->
    <div class="form-section">
      <h2>Search Land</h2>
      <input type="text" id="search" placeholder="Search by owner, location, or region" onkeyup="searchLand()">
      <div id="searchResults"></div>
    </div>

    <!-- Saved Lands Section -->
    <div class="form-section">
      <h2>Saved Lands</h2>
      <div id="landList"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
